[project]
name = "fable-mobile-export"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "executorch==1.2.0",
  "fable",
  "PyYAML>=6.0",
  "torch==2.11.0",
  "typer>=0.16",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
override-dependencies = [
  "torch==2.11.0",
]

[tool.uv.sources]
fable = { path = "../..", editable = true }
