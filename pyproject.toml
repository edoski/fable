[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kairos"
version = "0.1.0"
description = "Learning when to execute blockchain transactions."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "Edoardo" }
]
dependencies = [
  "numpy>=1.26",
  "polars>=1.5",
  "torch==2.7.1",
  "lightning==2.6.5",
  "pydantic>=2.12",
  "PyYAML>=6.0",
  "typer>=0.16",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1",
  "vulture>=2.16",
  "matplotlib>=3.10",
]

[project.scripts]
kairos = "kairos.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vulture]
paths = ["src", "tests", "experiments", "tools/mobile-export"]
exclude = [".venv"]
min_confidence = 90
